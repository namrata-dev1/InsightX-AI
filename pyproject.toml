[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insightx"
version = "0.1.0"
description = "InsightX AI: E-commerce Customer Analytics and Predictive Business Intelligence"
authors = [
    { name = "InsightX Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckdb>=0.9.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "statsmodels>=0.14.0",
    "shap>=0.43.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
